stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "cicd"'
      when: always 
    - when: never
build-job:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]


  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

  tags:
    - localhost1

deploy-job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client

    # setup SSH key
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    # avoid host verification issue
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - echo "$STG_ENV" > .env
    - scp -P 45669 .env $SERVER_USER@$SERVER_IP:/opt/base-classroom/
    - |
      ssh -p 456699 $SERVER_USER@$SERVER_IP << EOF
        cd /opt/base-classroom/
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
        docker compose restart
      EOF
 
  tags:
    - localhost1