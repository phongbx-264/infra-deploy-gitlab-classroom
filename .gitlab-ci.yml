stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" 
      when: always 
    - when: never
build-job:
  stage: build
  image: docker:24.0.5
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" 
      when: always 
    - when: never
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD gitlabregistry.onschool.edu.vn

  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

  tags:
    - dockerrunnerlocal250

deploy-job:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" 
      when: always 
    - when: never
  before_script:
    - apk add --no-cache openssh-client

    # setup SSH key
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # avoid host verification issue
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - echo "$PRO_ENV" > .env
    - scp .env $SERVER_USER@$SERVER_IP:/opt/inu-classroom/
    - |
      ssh $SERVER_USER@$SERVER_IP << EOF
        cd /opt/inu-classroom/
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD gitlabregistry.onschool.edu.vn
        docker compose restart
      EOF

  tags:
    - dockerrunnerlocal250